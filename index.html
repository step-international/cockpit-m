<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow">

<meta name="color-scheme" content="light dark">

<title>Esteban Shopify</title>
<style>
:root {
  --bg: #f5f5f7; --card: #fff; --soft: #ececf0; --line: #e5e5ea; --text: #1d1d1f; --muted: #6e6e73; --faint: #aeaeb2;
  --green: #1f9d55; --orange: #c46f00; --red: #d0342c; --blue: #0a66d8;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 10px 30px rgba(0,0,0,.06);
  --cvL: 42%;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #000; --card: #1c1c1e; --soft: #2c2c2e; --line: #2c2c2e; --text: #f5f5f7; --muted: #98989d; --faint: #5a5a5f;
    --green: #30d158; --orange: #ff9f0a; --red: #ff453a; --blue: #0a84ff; --shadow: none; --cvL: 60%; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.35 var(--font); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; overscroll-behavior-x: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.wrap { max-width: 520px; margin: 0 auto; padding: calc(36px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom)); }
.green { color: var(--green); } .orange { color: var(--orange); } .red { color: var(--red); } .blue { color: var(--blue); } .muted { color: var(--muted); }

/* sélecteur de période */
.seg { position: sticky; top: calc(10px + env(safe-area-inset-top)); z-index: 5; display: grid; grid-template-columns: 1.45fr 1fr 1fr 1fr 1fr; background: var(--soft); border-radius: 12px; padding: 3px; margin-top: 0; }
.seg button { height: 34px; border-radius: 9px; font-size: 14px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.seg button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

/* navigation jour / période */
.nav { display: flex; align-items: center; justify-content: space-between; margin: 18px 2px 4px; }
.nav .t { text-align: center; flex: 1; }
.nav .t b { display: block; font-size: 22px; font-weight: 750; letter-spacing: -.01em; }
.nav .t span { font-size: 13px; color: var(--muted); }
.arrow { width: 40px; height: 40px; border-radius: 50%; font-size: 24px; color: var(--muted); display: grid; place-items: center; }
.arrow:disabled { opacity: .2; }

.stage { touch-action: pan-y; }
.slide-l { animation: sl .22s ease-out; } .slide-r { animation: sr .22s ease-out; }
@keyframes sl { from { transform: translateX(40px); opacity: 0; } } @keyframes sr { from { transform: translateX(-40px); opacity: 0; } }

/* carte */
.card { background: var(--card); border-radius: 22px; box-shadow: var(--shadow); padding: 18px; margin-top: 12px; }
.head { display: flex; align-items: center; gap: 6px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: var(--faint); }
.bg-green { background: var(--green); } .bg-orange { background: var(--orange); } .bg-red { background: var(--red); } .bg-blue { background: var(--blue); }
.name { font-weight: 700; font-size: 15px; letter-spacing: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.flag { flex: none; margin-left: 5px; font-size: 14px; line-height: 1; }
.st-h { margin: 16px 0 6px; font-size: 15px; } .st-l { margin: 0; padding-left: 18px; font-size: 14px; line-height: 1.45; color: var(--muted); } .st-l li { margin-bottom: 6px; } .st-l b { color: var(--text); }   /* feuille Stratégie */
.att-note { margin: 10px 0 2px; font-size: 13px; line-height: 1.4; color: var(--muted); background: var(--soft); border-radius: 12px; padding: 10px 12px; }   /* ventes Shopify pas reliées à une pub par Meta */
.lt { flex: none; margin-left: 4px; font-size: 11px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }   /* heure du pays de la boutique */   /* drapeau du pays après le nom, comme les conversations */
.sp { flex: 1; }
.pill { font-size: 13px; font-weight: 650; padding: 3px 9px; border-radius: 99px; background: var(--soft); white-space: nowrap; }
.todo { font-size: 14px; font-weight: 600; margin-top: 10px; }
.big { font-size: 44px; font-weight: 780; letter-spacing: -.035em; line-height: 1; margin-top: 12px; }
.line { display: flex; gap: 8px; margin-top: 10px; font-size: 14px; }
.line span { color: var(--muted); font-size: 13px; display: block; }
.line div { flex: 1; font-weight: 650; white-space: nowrap; min-width: 0; }
.bars { position: relative; display: flex; gap: 3px; height: 64px; margin-top: 16px; }
.bars .c { position: relative; flex: 1; }
.bars .c i { position: absolute; left: 0; right: 0; display: block; border-radius: 4px; }
.bars .zero { position: absolute; left: 0; right: 0; height: 1px; background: var(--line); }
.cmp { font-size: 13px; color: var(--muted); margin-top: 8px; }
.total { background: transparent; box-shadow: none; padding: 6px 4px 0; }
.empty { color: var(--muted); margin-top: 12px; font-size: 15px; }
.foot { color: var(--faint); font-size: 12px; text-align: center; margin-top: 20px; }
.upd { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--muted); margin: 0 0 12px; }
.upd .live { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px rgba(48, 209, 88, .18); }
.rf { width: 34px; height: 34px; border-radius: 50%; background: var(--soft); color: var(--text); font-size: 18px; line-height: 34px; text-align: center; margin-left: 4px; }
.rf.spin { animation: spin .8s linear infinite; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-size: 14px; font-weight: 600; z-index: 50; white-space: nowrap; animation: up .2s ease-out; }
@keyframes up { from { opacity: 0; transform: translate(-50%, 8px); } }
@keyframes spin { to { transform: rotate(360deg); } }

/* écran du code */
.lock { min-height: 80vh; display: flex; flex-direction: column; justify-content: center; }
.lock h1 { font-size: 32px; margin: 0; }
.lock input { width: 100%; height: 54px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: 600 20px var(--font); padding: 0 16px; letter-spacing: .06em; margin-top: 18px; }
.btn { width: 100%; height: 52px; border-radius: 14px; background: var(--text); color: var(--bg); font-weight: 650; font-size: 17px; margin-top: 12px; }
.err { color: var(--red); font-size: 14px; margin-top: 10px; min-height: 20px; }
.link { color: var(--faint); font-size: 12px; margin-top: 8px; text-decoration: underline; }


/* Pubs Meta : bouton entouré bleu Meta + feuille « Pubs par ensemble » */
.pubbtn { border: 1.5px solid #0866ff; border-radius: 10px; padding: 1px 6px 2px; margin: -3px 0 0 -7px; text-align: left; font: inherit; color: inherit; }
.pubbtn span { color: #0866ff !important; }
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 60; animation: fade .15s ease-out; }
@keyframes fade { from { opacity: 0; } }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 88vh; overflow-y: auto; background: var(--bg); border-radius: 22px 22px 0 0; z-index: 61; padding: 10px 16px calc(24px + env(safe-area-inset-bottom)); animation: rise .22s ease-out; -webkit-overflow-scrolling: touch; }
@keyframes rise { from { transform: translateY(40px); } }
.sheet .grab { width: 38px; height: 5px; border-radius: 3px; background: var(--faint); margin: 0 auto 12px; opacity: .6; }
.sheet h2 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
.sheet .x { position: absolute; right: 14px; top: 12px; width: 32px; height: 32px; border-radius: 50%; background: var(--soft); font-size: 18px; color: var(--muted); }
.adset { margin-top: 10px; }
.adset > summary { list-style: none; display: flex; align-items: center; gap: 10px; padding: 14px 14px; background: var(--card); border-radius: 16px; cursor: pointer; }
.adset > summary::-webkit-details-marker { display: none; }
.adset > summary .t { flex: 1; min-width: 0; }
.adset > summary .t b { display: block; font-size: 15px; }
.adset > summary .t small { color: var(--muted); font-size: 12px; }
.adset > summary .v { font-weight: 780; font-size: 18px; white-space: nowrap; }
.adset > summary .chev { color: var(--muted); font-size: 18px; transition: transform .15s; }
.adset[open] > summary .chev { transform: rotate(90deg); }
.adset[open] > summary { border-radius: 16px 16px 6px 6px; }
.adrow { display: flex; align-items: center; gap: 12px; padding: 9px 10px; background: var(--card); border-radius: 14px; margin-top: 6px; text-decoration: none; color: inherit; }
.adrow img, .adrow .ph { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; background: var(--soft); flex: none; }
.adrow .nm { flex: 1; min-width: 0; font-size: 14px; }
.adrow .nm b { font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.adrow .nm small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; margin-top: 2px; }
.adrow .sp2 { font-weight: 750; font-size: 16px; white-space: nowrap; }
.adrow.zero { opacity: .55; }
button.adrow { width: 100%; border: 0; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.player { position: fixed; inset: 0; z-index: 70; background: #000; display: flex; flex-direction: column; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); animation: fade .15s ease-out; }
.player-h { display: flex; align-items: center; gap: 10px; padding: 12px 16px; color: #fff; }
.player-h b { flex: 1; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.player-h .x { position: static; width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.15); color: #fff; font-size: 20px; }
.player-f { position: relative; flex: 1; display: flex; justify-content: center; overflow: auto; -webkit-overflow-scrolling: touch; }
.player-f iframe { position: relative; width: min(100%, 420px); height: 100%; min-height: 640px; border: 0; background: #fff; opacity: 0; transition: opacity .2s; }
.player-f iframe.ok { opacity: 1; }
.player-wait { position: absolute; inset: 0; display: grid; place-items: center; color: rgba(255,255,255,.6); font-size: 15px; }

/* Chat Claude : bulle sur chaque boutique → vue plein écran qui suit le clavier de l'iPhone */
.cbtn { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 9px; white-space: nowrap; flex: none; border-radius: 99px; font-size: 13px; font-weight: 700; color: #fff; background: linear-gradient(135deg, #d97757, #c15f3c); }
.lv { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 700; color: var(--green); margin-left: 2px; flex: none; }
.lv i { position: relative; width: 8px; height: 8px; border-radius: 50%; background: #29c467; }
.lv i::after { content: ''; position: absolute; inset: 0; border-radius: 50%; background: #29c467; animation: livepulse 1.8s ease-out infinite; }
@keyframes livepulse { 0% { transform: scale(1); opacity: .65; } 100% { transform: scale(3); opacity: 0; } }
/* Changements programmés : à droite du total, liste complète en feuille */
.toprow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; align-items: stretch; margin-top: 12px; }
.toprow > .card { margin-top: 0; }
.toprow.solo { grid-template-columns: minmax(0, 1fr); }
.sched-box { padding: 12px 12px 10px; border-radius: 18px; background: var(--card); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; min-width: 0; text-align: left; font: inherit; color: inherit; width: 100%; }
.sched-box .sh { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.sched-box .sh b { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: rgba(10,132,255,.14); color: var(--blue); font-size: 12px; display: grid; place-items: center; letter-spacing: 0; }
.lots { font-size: 13px; margin: 6px 0 2px; color: var(--muted); }
.lots.green b { color: #29c467; } .lots.orange b { color: #ff9f0a; } .lots.red { color: #ff453a; font-weight: 650; }
.sched-box .more { font-size: 13px; font-weight: 650; color: var(--blue); margin-top: auto; }
/* plusieurs changements : cartes côte à côte, on glisse vers la droite (06/11) ; la suivante dépasse pour le montrer */
.sched-strip { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; min-width: 0; padding-bottom: 2px; }
.sched-strip::-webkit-scrollbar { display: none; }
.sched-strip > .sched-box { flex: 0 0 100%; scroll-snap-align: start; }
.sched-strip.multi > .sched-box { flex-basis: calc(100% - 46px); }
.srow { display: flex; gap: 8px; align-items: flex-start; min-width: 0; }
.srow .t { flex: none; min-width: 46px; text-align: center; padding: 3px 4px; border-radius: 8px; background: rgba(10,132,255,.14); color: var(--blue); line-height: 1.1; }
.srow .t b { display: block; font-size: 14px; } .srow .t small { font-size: 10px; }
.srow .w { min-width: 0; font-size: 13px; line-height: 1.3; }
.srow .w span { display: block; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .02em; }
.srow .w div { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.sheet .srow { padding: 10px 12px; background: var(--card); border-radius: 14px; margin-top: 8px; }
.sheet .srow .w div { -webkit-line-clamp: unset; }
.ubar { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; color: var(--muted); margin: -4px 0 12px; }
.ubar b { color: var(--text); }
.ubar i, .uchip i { display: block; width: 64px; height: 5px; border-radius: 3px; background: var(--soft); overflow: hidden; }
.ubar i em, .uchip i em { display: block; height: 100%; border-radius: 3px; }
html.chat-open, html.chat-open body { overflow: hidden; height: 100%; }
.chat-v { position: fixed; left: 0; right: 0; top: 0; height: 100vh; z-index: 80; background: var(--bg); display: flex; flex-direction: column; }
.cv-h { display: flex; align-items: center; gap: 8px; padding: calc(env(safe-area-inset-top) + 16px) 14px 10px 6px; border-bottom: 1px solid var(--line); }   /* fond sous la barre d'état, ‹ bien sous la Dynamic Island (21/10) */
.cv-back { width: 40px; height: 40px; font-size: 34px; line-height: 36px; color: var(--blue); flex: none; }
.cv-t { flex: 1; min-width: 0; }
.cv-t b { display: block; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cv-t small { color: var(--muted); font-size: 12px; }
.uchip { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; font-size: 11px; color: var(--muted); }
.uchip span b { font-size: 15px; margin-left: 4px; }
.cv-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 14px 12px 6px; }
.m { display: flex; flex-direction: column; margin-bottom: 10px; }
.m.me { align-items: flex-end; } .m.ai { align-items: flex-start; }
.m .b { max-width: 86%; padding: 9px 14px; border-radius: 20px; font-size: 16px; line-height: 1.42; overflow-wrap: anywhere; }
.m.me .b { background: var(--blue); color: #fff; border-bottom-right-radius: 6px; white-space: pre-wrap; }
.m.ai .b { background: var(--card); border-bottom-left-radius: 6px; box-shadow: var(--shadow); }
.m .st { font-size: 11px; color: var(--muted); margin: 3px 6px 0; }
.m.err { align-items: center; text-align: center; color: var(--red); font-size: 14px; padding: 0 16px; }
.m.note { align-items: center; text-align: center; color: var(--muted); font-size: 14px; padding: 24px 16px; }
.md p { margin: 0 0 6px; } .md p:last-child { margin-bottom: 0; }
.md p.h { font-weight: 700; margin-top: 8px; }
.md p.row { font-size: 14px; color: var(--muted); }
.md ul, .md ol { margin: 2px 0 6px; padding-left: 20px; } .md li { margin: 2px 0; }
.md code { font: 14px ui-monospace, Menlo, monospace; background: var(--soft); padding: 1px 5px; border-radius: 5px; }
.md pre { font: 13px/1.4 ui-monospace, Menlo, monospace; background: var(--soft); padding: 8px 10px; border-radius: 10px; overflow-x: auto; margin: 6px 0; }
.md .act { margin: 6px 0; padding: 8px 10px; border-radius: 12px; background: var(--soft); font-weight: 650; font-size: 14px; }
.md .act small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
.typing { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.cv-in { display: flex; align-items: flex-end; gap: 8px; padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--bg); }
.chat-v.kb .cv-in { padding-bottom: 8px; }   /* clavier ouvert : pas de marge de la barre d'accueil */
.cv-in textarea { flex: 1; resize: none; min-height: 40px; max-height: 132px; border-radius: 20px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: 16px/1.35 var(--font); padding: 9px 14px; outline: none; }
.cv-in button { flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--blue); color: #fff; font-size: 20px; font-weight: 700; }
.cv-in button:disabled { opacity: .35; }
.cv-screen { max-width: 400px; margin: 0 auto; padding: 28px 8px; text-align: center; }
.cv-screen .ico { font-size: 40px; }
.cv-screen h3 { margin: 8px 0 6px; font-size: 20px; }
.cv-screen p { color: var(--muted); font-size: 15px; margin: 0 0 16px; }
.cv-screen input { width: 100%; height: 54px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: 700 26px var(--font); letter-spacing: .3em; text-align: center; margin: 12px 0 0; }
.cv-screen .btn.soft { background: var(--soft); color: var(--text); }

/* ---------- Apparence Liquid Glass (comme sur le Mac) ---------- */
:root {
  --glass: linear-gradient(180deg, rgba(255,255,255,.66), rgba(255,255,255,.46));
  --glass-strong: rgba(250,250,253,.86);
  --glass-edge: inset 0 1px 0 rgba(255,255,255,.95), inset 0 0 0 1px rgba(255,255,255,.55);
  --wall: radial-gradient(80% 40% at 0% 0%, rgba(140,155,200,.22), transparent 70%), radial-gradient(80% 40% at 100% 100%, rgba(150,140,190,.16), transparent 70%), #e8e9ee;
}
@media (prefers-color-scheme: dark) {
  :root {
    --glass: linear-gradient(180deg, rgba(255,255,255,.11), rgba(255,255,255,.05));
    --glass-strong: rgba(26,28,40,.82);
    --glass-edge: inset 0 1px 0 rgba(255,255,255,.16), inset 0 0 0 1px rgba(255,255,255,.07);
    --wall: radial-gradient(80% 40% at 0% 0%, rgba(70,85,150,.16), transparent 72%), radial-gradient(80% 40% at 100% 100%, rgba(80,70,140,.11), transparent 72%), #050608;
    --soft: rgba(255,255,255,.1); --line: rgba(255,255,255,.1);
  }
}
html, body { background: transparent; }
body::before { content: ''; position: fixed; inset: 0; z-index: -1; background: var(--wall); }
.card:not(.total), .sched-box { background: var(--glass); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); box-shadow: var(--glass-edge), 0 12px 34px -14px rgba(0,0,0,.45); }
.seg { background: var(--glass); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); box-shadow: var(--glass-edge); border-radius: 999px; padding: 4px; }
.seg button { border-radius: 999px; }
.seg button.on { background: rgba(255,255,255,.22); box-shadow: inset 0 1px 0 rgba(255,255,255,.3); }
.pill, .rf { box-shadow: inset 0 1px 0 rgba(255,255,255,.14); }
.btn { border-radius: 999px; }
.sheet { background: var(--glass-strong); -webkit-backdrop-filter: blur(40px) saturate(180%); backdrop-filter: blur(40px) saturate(180%); box-shadow: var(--glass-edge); }
.sheet .srow, .adset > summary, .adrow { background: rgba(255,255,255,.07); box-shadow: inset 0 1px 0 rgba(255,255,255,.08); }
.chat-v { background: transparent; }
.chat-v::before { content: ''; position: absolute; inset: 0; z-index: -1; background: var(--wall); }
.cv-h, .cv-in { background: var(--glass); -webkit-backdrop-filter: blur(30px) saturate(190%); backdrop-filter: blur(30px) saturate(190%); border-color: rgba(255,255,255,.08); }
.m.ai .b { background: var(--glass); -webkit-backdrop-filter: blur(20px) saturate(170%); backdrop-filter: blur(20px) saturate(170%); box-shadow: var(--glass-edge); }
.m.me .b { box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 6px 16px -8px rgba(10,132,255,.8); }
.cv-in textarea, .cv-screen input, .lock input { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.12); }
.cbtn { box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 6px 16px -8px rgba(217,119,87,.8); }

/* stats des pubs (21/10) : pastille sur « Pub », 6 cases colorées en haut de la liste, ligne CPC · CTR · CPM par pub */
.pubbtn .pd { display: inline-block; width: 7px; height: 7px; margin-left: 4px; border-radius: 50%; vertical-align: 1px; }
.kp { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.kp .k { min-width: 0; padding: 10px 11px 9px; border-radius: 14px; background: rgba(255,255,255,.06); box-shadow: inset 0 1px 0 rgba(255,255,255,.06); }
.kp .k span { display: block; font-size: 12px; font-weight: 650; color: var(--muted); white-space: nowrap; }   /* « Pub / commande » sur une ligne (déborde dans la marge de la case plutôt que de décaler la valeur) */
.kp .k b { display: block; margin-top: 2px; font-size: 19px; font-weight: 760; letter-spacing: -.01em; white-space: nowrap; }
.kp .k small { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; margin-top: 1px; font-size: 11px; line-height: 1.25; color: var(--faint); overflow: hidden; }   /* repère sur 2 lignes (« pas encore de commande » ne tient pas sur une) */
.kp-l { margin: 8px 2px 2px; font-size: 11.5px; color: var(--faint); }
.adrow .nm .st, .adset > summary .t .st { display: block; margin-top: 2px; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.adrow .nm .st b, .adset > summary .t .st b { display: inline; font-size: inherit; font-weight: 650; -webkit-line-clamp: unset; overflow: visible; }   /* pas le style du nom de la pub */

.cbtn .cl-ico, .big-btn .cl-ico, .cv-chip:not(.soft) .cl-ico, .soft-btn.go .cl-ico { color: #fdf6ef; }
.tab.mid.claude .orb .cl-ico { width: 31px; height: 31px; color: #fdf6ef; }
.cv-chip { display: inline-flex; align-items: center; gap: 6px; }
.cbtn.mini .cl-ico { width: 19px; height: 19px; }
.mi-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }   /* chiffres (ou compte à rebours) + Claude à droite (22/10) */
.mi-row .line { flex: 1; min-width: 0; margin-top: 0 !important; display: grid; grid-template-columns: 1fr 1.3fr 1.45fr .55fr .9fr; gap: 6px; }   /* Cmd serrée près de Conv. : CA et Pub en entier (22/10) */
.mi-row .mi-x { flex: 1; min-width: 0; margin-top: 0; }
.mi-row .line > div { text-align: center; }   /* chaque chiffre centré sous son titre, quelle que soit sa longueur (22/10) */
.mi-row .line .pubbtn { margin: -2px auto 0; }
.mi-b { flex: none; padding: 1px 6px; border-radius: 99px; background: var(--soft); box-shadow: inset 0 1px 0 rgba(255,255,255,.14); font-size: 11px; font-weight: 650; color: var(--muted); white-space: nowrap; }   /* bulle comme avant (22/10) */
/* total des boutiques en une ligne (22/10) */
.tot { display: flex; align-items: flex-end; gap: 16px; padding: 10px 15px 11px; border-radius: 18px; background: var(--glass); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); box-shadow: var(--glass-edge); }
.tot span { display: block; font-size: 11.5px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.tot-m { flex: 1; min-width: 0; text-align: right; }
.tot-m b { display: block; margin-top: 1px; font-size: 26px; font-weight: 780; letter-spacing: -.02em; line-height: 1.08; white-space: nowrap; }
.tot-s b { display: block; margin-top: 2px; font-size: 15px; font-weight: 700; white-space: nowrap; }
/* vue compacte des boutiques (22/10) : les 4 d'un coup. Ligne du haut : « Détails / Compact » à gauche, mise à jour au milieu, ↻ à droite */
.home-top .upd { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.home-top .upd .vt { justify-self: center; margin-left: 0; }   /* au milieu entre le bord et « Mis à jour » */
.home-top .upd .rf { justify-self: center; margin-left: 0; }
.upd-c { display: inline-flex; align-items: center; gap: 8px; }
.vt { height: 30px; padding: 0 11px; margin-left: 2px; border-radius: 999px; background: var(--soft); color: var(--text); font-size: 13px; font-weight: 650; box-shadow: inset 0 1px 0 rgba(255,255,255,.14); }
.card.mini { padding: 15px 17px 14px; margin-top: 12px; border-radius: 20px; }   /* aérée (22/10 : « trop serré ») */
.card.mini .head { gap: 7px; min-height: 28px; }
.card.mini .name { font-size: 15px; }
.card.mini .lv { margin-left: 0; font-size: 12px; gap: 3px; flex: none; width: 34px; justify-content: center; }   /* centré au-dessus du bouton Claude (34 px), quel que soit le nombre */
.card.mini .lv i { width: 6px; height: 6px; }
.mi-p { font-size: 21px; font-weight: 780; letter-spacing: -.02em; white-space: nowrap; }
.cbtn.mini { width: 34px; height: 34px; padding: 0; margin-left: 0; justify-content: center; font-size: 13px; }
.card.mini .line { margin-top: 10px; font-size: 14.5px; }
.card.mini .line span { font-size: 11.5px; margin-bottom: 1px; }
.card.mini .pubbtn { padding: 0 5px 1px; margin: -2px 0 0 -6px; border-radius: 8px; }
.card.mini .tg { padding: 1px 5px; font-size: 11px; }
.mi-new { flex: none; padding: 1px 6px; border-radius: 99px; font-size: 11px; font-weight: 700; color: var(--blue); background: rgba(10,132,255,.15); }
.mi-x { margin-top: 8px; font-size: 14px; color: var(--muted); }
.mi-x.launch { color: var(--blue); font-weight: 650; }
.mi-todo.open { white-space: normal; overflow: visible; line-height: 1.38; }
.mi-todo { cursor: pointer; margin-top: 9px; font-size: 13px; font-weight: 650; color: var(--orange); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- Page principale compacte (21/10 : tout tient sur l'écran de l'iPhone, sans descendre) ---------- */
:root { --top-pad: 30px; --top-bg: rgba(232,233,238,.82); }   /* --top-pad : assez bas sous la Dynamic Island (Adama, 21/10) */
@media (prefers-color-scheme: dark) { :root { --top-bg: rgba(5,6,8,.8); } }
.wrap { padding-top: calc(var(--top-pad) + env(safe-area-inset-top)); }
/* en-tête figé (21/10) : mise à jour, période, date et total restent en haut, juste sous la Dynamic Island ; seules les boutiques
   défilent dessous. Fixe (pas « collant ») : sur l'iPhone, le collant à marge négative comptait l'encoche deux fois. */
.wrap:has(> .home-top) { padding-top: 0; }
.home-sp { height: 300px; }   /* cale = hauteur de l'en-tête, mesurée par renderHome */
.home-top { position: fixed; top: 0; left: 0; right: 0; z-index: 6; padding: calc(var(--top-pad) + env(safe-area-inset-top)) max(16px, calc(50vw - 244px)) 8px; background: var(--top-bg); -webkit-backdrop-filter: blur(22px) saturate(170%); backdrop-filter: blur(22px) saturate(170%); }
.home-top::after { content: ''; position: absolute; left: 0; right: 0; bottom: -26px; height: 26px; background: linear-gradient(var(--top-bg), rgba(var(--fade), .45) 45%, transparent); pointer-events: none; }
.home-top .seg { position: static; }

/* ---------- Onglets en bas (comme Fidely) : Commentaires · Tableau de bord · WhatsApp ---------- */
:root { --ring: #f6f6f9; --wa: #1fb655; --wa-ink: #0b7a37; --tab-on: rgba(0,0,0,.06); }
@media (prefers-color-scheme: dark) { :root { --ring: #16171f; --wa: #25d366; --wa-ink: #25d366; --tab-on: rgba(255,255,255,.14); } }
:root { --bar-b: max(8px, calc(env(safe-area-inset-bottom) - 20px)); }   /* écart barre ↔ bas de l'écran (Adama, 21/10) */
html.has-tabs .wrap { padding-bottom: calc(118px + env(safe-area-inset-bottom)); }
/* même hauteur minimale pour toutes les pages (+1 px : toutes défilent ; dvh = hauteur visible, comme la barre) : sur l'iPhone, une page trop courte pour défiler
   remontait la barre du bas de quelques points ; elle ne doit jamais bouger d'un onglet à l'autre */
html.has-tabs .wrap { min-height: calc(100dvh + 1px); }   /* rien n'est caché sous la barre */
html.has-tabs .toast { bottom: calc(108px + env(safe-area-inset-bottom)); }
html.chat-open .tabbar { display: none; }
/* sous la barre (21/10) : les cartes s'effacent en dégradé jusqu'en bas de l'écran, plus de coupure */
:root { --fade: 232,233,238; }
@media (prefers-color-scheme: dark) { :root { --fade: 5,6,8; } }
html.has-tabs body::after { content: ''; position: fixed; left: 0; right: 0; bottom: 0; top: calc(100dvh - 104px - var(--bar-b)); z-index: 39; pointer-events: none; height: calc(104px + var(--bar-b)); background: linear-gradient(to bottom, rgba(var(--fade), 0), rgba(var(--fade), .9) 42%, rgb(var(--fade)) 68%); }
html.chat-open body::after { display: none; }
.tabbar { position: fixed; z-index: 40; left: 12px; right: 12px; margin: 0 auto; max-width: 460px; bottom: var(--bar-b); top: calc(100dvh - 64px - var(--bar-b)); height: 64px; padding: 0 6px; display: grid; grid-template-columns: minmax(0, 1fr) 82px 82px minmax(0, 1fr); border-radius: 999px; background: var(--glass-strong); -webkit-backdrop-filter: blur(30px) saturate(190%); backdrop-filter: blur(30px) saturate(190%); box-shadow: var(--glass-edge), 0 16px 40px -14px rgba(0,0,0,.6); animation: rise .25s ease-out; }
.tab { position: relative; z-index: 1; isolation: isolate; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 650; color: var(--muted); }
.tab svg { width: 26px; height: 26px; display: block; }
.tab .lb { white-space: nowrap; }
.tab.on { color: var(--text); }
.tab[data-t="comments"].on svg { color: var(--blue); }
.tab[data-t="whatsapp"].on svg { color: var(--wa); }
.tab .bd { position: absolute; top: 5px; left: calc(50% + 4px); min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px; background: var(--red); color: #fff; font-size: 11px; font-weight: 750; line-height: 19px; text-align: center; box-shadow: 0 0 0 2px var(--ring); }
.tab.mid .orb { width: 62px; height: 62px; margin-top: -26px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: linear-gradient(150deg, #4c9bff, #0a5fd8); box-shadow: 0 0 0 5px var(--ring), inset 0 1px 0 rgba(255,255,255,.45), 0 12px 26px -8px rgba(10,132,255,.9); transition: transform .15s, opacity .15s; }
.tab.mid:not(.on) .orb { filter: saturate(.6) brightness(.82); box-shadow: 0 0 0 5px var(--ring), inset 0 1px 0 rgba(255,255,255,.3); }   /* jamais transparent : sinon le bord de la barre se voit au travers (21/10) */
.tab.mid:active .orb { transform: scale(.94); }
.tab.mid .orb svg { width: 28px; height: 28px; }
.tab.mid .lb { margin-top: 3px; }
/* 2e bouton principal (21/10) : Claude, diagnostic du jour de toutes les boutiques — même taille que l'Accueil, couleur de Claude */
.tab.mid.claude .orb { background: linear-gradient(150deg, #ea8d6e, #c15f3c); box-shadow: 0 0 0 5px var(--ring), inset 0 1px 0 rgba(255,255,255,.45), 0 12px 26px -8px rgba(217,119,87,.9); filter: none; }
.tab.mid.claude .orb svg { width: 27px; height: 27px; }
.tab.mid.claude.busy .orb { animation: claudepulse 1.6s ease-in-out infinite; }
@keyframes claudepulse { 50% { box-shadow: 0 0 0 5px var(--ring), 0 0 0 11px rgba(217,119,87,.35), 0 12px 26px -8px rgba(217,119,87,.9); } }
/* verre liquide d'iOS 26 (Adama, 02/11) : une seule bulle pour toute la barre. Elle glisse d'un onglet à l'autre en s'étirant
   (et se fond dans le rond de l'Accueil) ; sous le doigt elle grossit en loupe de verre, suit le glissement et se pose où on lâche */
:root { --lq-glass: radial-gradient(130% 100% at 50% 0%, rgba(255,255,255,.95), rgba(228,230,238,.6) 58%, rgba(255,255,255,.8));
  --lq-edge: inset 0 1.5px 1px #fff, inset 0 -1px 1px rgba(255,255,255,.7), inset 0 0 0 1px rgba(0,0,0,.07), 0 10px 26px -10px rgba(0,0,0,.35); }
@media (prefers-color-scheme: dark) { :root { --lq-glass: radial-gradient(130% 100% at 50% 0%, rgba(255,255,255,.34), rgba(255,255,255,.07) 55%, rgba(255,255,255,.16));
  --lq-edge: inset 0 1.5px 1px rgba(255,255,255,.8), inset 0 -1px 1px rgba(255,255,255,.3), inset 0 0 0 1px rgba(255,255,255,.2), 0 10px 26px -10px rgba(0,0,0,.6); } }
.tabbar { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.lq-b { position: absolute; left: 0; top: 0; z-index: 0; width: 0; height: 0; pointer-events: none; border-radius: 999px; will-change: transform, width, height, opacity; --lift: 0; }
.lq-b::before, .lq-b::after { content: ''; position: absolute; inset: 0; border-radius: inherit; }
.lq-b::before { background: var(--tab-on); box-shadow: inset 0 1px 0 rgba(255,255,255,.2); opacity: calc(1 - var(--lift)); }

/* carte commentaire : traduction en français en grand, original replié */
.cm-h { display: flex; align-items: center; gap: 7px; min-width: 0; }

<div class="wrap" id="app"></div>
<script>
'use strict';
const KEY = 'cockpit-code';
const BUILD = '546a7b0afa'; // remplacé à la publication par l'empreinte de cette page
const app = document.getElementById('app');
/** Drapeau du pays (DE → 🇩🇪), comme les titres des conversations ; '' si inconnu. */
const flagOf = (cc) => (/^[A-Z]{2}$/i.test(String(cc || '')) ? String.fromCodePoint(...[...String(cc).toUpperCase()].map((c) => 0x1f1a5 + c.charCodeAt(0))) : '');
/** Heure du pays de la boutique (« 14:32 », son fuseau), remise à jour par la boucle des 30 s. */
const hmIn = (tz) => { try { return new Intl.DateTimeFormat('fr-FR', { hour: '2-digit', minute: '2-digit', timeZone: tz }).format(new Date()); } catch { return ''; } };
const timeTag = (s) => { const t = s?.dayTz ? hmIn(s.dayTz) : ''; return t ? `<span class="lt" data-ltz="${esc(s.dayTz)}">${t}</span>` : ''; };
const flagTag = (s) => { const f = flagOf(s?.market); return f ? `<span class="flag" aria-hidden="true">${f}</span>` : ''; };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = (d) => new Intl.NumberFormat('fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d });
const eur = (n, sign) => (n == null || isNaN(n)) ? '—' : `${n < 0 ? '−' : sign && n > 0 ? '+' : ''}${nf(0).format(Math.abs(n))} €`;
/** Montant dans une autre devise que l'euro (budget Meta, pubs d'un compte en dollars) : « 100 $ USD » (règle d'Adama : code ISO quand le symbole est ambigu). */

async function decrypt(blob, code) {

function rowsFor(shop, from, to) { return (shop.days || []).filter((d) => d.day >= from && d.day <= to); }

function bars(shop, from, to) {

  const key = (x) => new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Tokyo' }).format(new Date(x));
  const local = tz && tz !== 'Asia/Tokyo' ? ` (${fmt(tz, { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })} à ${tz.split('/').pop().replace(/_/g, ' ')})` : '';
  if (d <= 0) return `Pubs lancées à ${hm}${short ? '' : local} · pas encore de vente`;
  const when = key(t) === key(now) ? `aujourd'hui ${hm}` : key(t) === key(now + 864e5) ? `demain ${hm}` : `${fmt('Asia/Tokyo', { weekday: 'short', day: 'numeric', month: 'numeric' })} ${hm}`;

const SEEN_KEY = 'adama-shopify-cseen';

const DAY_MS = 864e5;
function seenLoad() {

    if (!c.ours) out.push({ key: String(c.id), at: c.createdAt, id: c.id });
    for (const r of c.replies || []) if (r.auto || !r.ours) out.push({ key: `${c.id}>${r.createdAt}`, at: r.createdAt, id: c.id });

 * compterait), 7 jours ensuite (au-delà, la liste des clés gardées a pu être raccourcie).
 */
function cUnseen(e, seen, now) {
  if (seen.ids.has(e.key)) return false;
  const t = Date.parse(e.at), base = seen.at ? Date.parse(seen.at) : NaN;
  if (!Number.isFinite(t)) return false;
  return t > (Number.isFinite(base) ? base - 7 * DAY_MS : now - DAY_MS);

  const ids = [...old.slice(Math.max(0, old.length - Math.max(0, SEEN_MAX - cur.size))), ...cur];

function lqFollow(cx) {
  const d = LQ.drag, W = d.r.width; d.cx = cx;
  if (Math.abs(cx - d.x0) > 8) d.moved = true;
  lqSet({ x: Math.max(LQ_UP.w / 2 + 2, Math.min(W - LQ_UP.w / 2 - 2, cx - d.r.left)), w: LQ_UP.w, h: LQ_UP.h, o: 1, l: 1 });
  d.b = lqUnder(cx - d.r.left);
  for (const t of LQ.bar.querySelectorAll('.tab')) t.classList.toggle('lq', t === d.b);
}
/** Doigt levé : la bulle redescend sur l'onglet choisi. Glisser → on ouvre ici l'onglet lâché (true) ; simple toucher → le clic s'en charge. */
function lqEnd(cancel) {
  const d = LQ.drag; if (!d) return false;
  LQ.drag = null;
  LQ.bar?.querySelectorAll('.tab.lq').forEach((t) => t.classList.remove('lq'));
  const t = d.b?.dataset.t, claude = !!d.b?.hasAttribute('data-claude');
  lqTo(!cancel && t ? t : S.tab);
  if (cancel || !d.moved || !d.b) return false;
  LQ.ate = performance.now();
  if (claude) openChat('diag'); else if (t && t !== S.tab) setTab(t);
  return true;
}
function lqBind(bar) {
  const x = (e) => e.changedTouches[0].clientX;
  bar.addEventListener('touchstart', (e) => { if (e.touches.length === 1) lqStart(x(e)); else lqEnd(true); }, { passive: true });
  bar.addEventListener('touchmove', (e) => { if (LQ.drag) lqFollow(x(e)); }, { passive: true });
  bar.addEventListener('touchend', (e) => { if (lqEnd(false)) e.preventDefault(); });   // glisser : pas de clic en plus
  bar.addEventListener('touchcancel', () => lqEnd(true));
  bar.addEventListener('pointerdown', (e) => { if (e.pointerType === 'mouse' && e.button === 0) lqStart(e.clientX); });   // souris (Mac) : mêmes gestes
  if (lqBind.done) return; lqBind.done = true;
  addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse' && LQ.drag) lqFollow(e.clientX); });
  addEventListener('pointerup', (e) => { if (e.pointerType === 'mouse') lqEnd(false); });
  addEventListener('resize', () => lqTo(S.tab, true));
}
/** Le Claude du diagnostic travaille (question envoyée d'ici, réponse pas encore là) : le bouton pulse. */

// ---------- Onglet Commentaires (pubs Facebook et Instagram, toujours lus en français) ----------
const TAGS = { question: ['Question', 'blue'], positif: ['Positif', 'green'], negatif: ['Négatif', 'orange'], spam: ['Spam', 'grey'], nuisible: ['Nuisible', 'red'] };
const LANGS = { de: 'allemand', en: 'anglais', fr: 'français', es: 'espagnol', it: 'italien', nl: 'néerlandais', pt: 'portugais', pl: 'polonais', tr: 'turc', ar: 'arabe', ru: 'russe', ro: 'roumain', hr: 'croate', sr: 'serbe', bs: 'bosnien', sq: 'albanais', el: 'grec', uk: 'ukrainien' };
// filtres simplifiés (Adama ne gère pas les commentaires : le pilote automatique répond)
const C_FILTERS = [['all', 'Tout'], ['todo', 'À traiter'], ['hidden', 'Masqués']];
const C_EMPTY = { todo: 'Rien à traiter : tout a une réponse.', hidden: 'Aucun commentaire masqué.', all: 'Aucun commentaire pour l\'instant.' };
const cMatch = (c, f) => (f === 'todo' ? !!c.todo : f === 'hidden' ? !!c.hidden : true);
/** Traduction française d'un texte, ou null tant qu'elle n'est pas là : jamais l'original (allemand…) à sa place. */
function frText(text, fr, lang) {
  const t = String(text ?? '').trim(), f = String(fr ?? '').trim();
  if (!t) return '';
  if (!f) return null;
  if (f === t && lang && lang !== 'fr') return null;   // recopié tel quel : pas encore traduit
  return f;
}
const WAIT_TR = 'Traduction en cours…';
/** Ligne du pilote automatique : ce qu'il fait, et ce qu'il a fait aujourd'hui (réglé sur le Mac). */
function pilotLine(A, blocked) {

  const done = `aujourd'hui ${r} réponse${r > 1 ? 's' : ''}${h ? `, ${h} masqué${h > 1 ? 's' : ''}` : ''}`;

function commentCard(c, showShop, fresh) {
  const tg = TAGS[c.tag];
  const who = c.author ? (c.platform === 'ig' ? `@${c.author}` : c.author) : 'Inconnu';
  const ads = (c.ads || []).slice(0, 2).join(' · ');
  const where = [showShop ? c.shopName : '', ads ? `Pub ${ads}` : ''].filter(Boolean).join(' · ');

  const autoOn = !!S.data.comments?.auto?.enabled;
  // une seule étiquette d'état : masqué, sinon à traiter, sinon le genre (question, positif…)

  // l'original reste à portée (replié), seulement s'il diffère de ce qui est affiché

  // réponses : la traduction française en grand ; celle du pilote automatique porte « Auto » ; le texte envoyé reste replié
  const reps = (c.replies || []).map((r) => {

  return `<div class="card cm ${c.hidden ? 'dim' : ''} ${fresh ? 'new' : ''}">

// ---------- Stats des pubs (21/10) : CPC, CTR, CPM, conversion, coût par achat, ROAS, aux couleurs de la formation ----------
// Mêmes règles que le Mac (engine.js : classify, buildKpis) ; repères envoyés par le Mac dans shop.ref.
// g = bon (vert), o = limite (orange), r = mauvais (rouge), '' = pas de repère
const ST_COLOR = { g: 'var(--green)', o: 'var(--orange)', r: 'var(--red)' };
const stStyle = (st) => (ST_COLOR[st] ? `color:${ST_COLOR[st]}` : '');
/**
 * Montant dans la devise du compte pub, au centime (CPC, CPM) : « 0,45 $ USD ».
 * tight : case étroite (valeur des cases, ligne CPC · CTR · CPM) → « $ » seul ; « $ USD » débordait, et le titre dit déjà « … $ USD dépensés ».
 */
const money2 = (n, cur, tight = false) => (n == null || isNaN(n) ? '—' : `${nf(2).format(n)} ${cur === 'USD' ? (tight ? '$' : '$ USD') : !cur || cur === 'EUR' ? '€' : cur}`);
/**
 * Au centime, converti d'office en euros (CPC, CPM et leurs repères : « 0,22 € ») ; sans taux, comme avant (money2).
 * Espace insécable avant « € » : à 375 px, « mauvais > 0,45 € » ne laisse pas « € » seul sur sa ligne.
 */
const eu2 = (n, cur, tight = false) => { const r = rateOf(cur); return r == null ? money2(n, cur, tight) : n == null || isNaN(n) ? '—' : `${nf(2).format(n * r)} €`; };
/**
 * Totaux des pubs sur la période (une pub, ou toutes) : dépense (devise du compte pub), achats Meta, impressions, clics.
 * adDays = [jour, pub, dépense, achats, impressions, clics sur le lien, clics (tous)] : CPC sur les clics lien,
 * CTR (tous) comme la règle des 1,5 % (clics lien à défaut, anciennes données sans 7e colonne).
 */
function adTot(shop, rg, id = null) {
  const t = { spend: 0, purchases: 0, imp: 0, clk: 0, all: 0 };
  for (const [day, ad, spend, purch, imp, clk, all] of shop.adDays || []) {
    if (day < rg.from || day > rg.to || (id && ad !== id)) continue;
    t.spend += spend; t.purchases += purch; t.imp += imp || 0; t.clk += clk || 0; t.all += all ?? clk ?? 0;
  }
  return { ...t, cpc: t.clk ? t.spend / t.clk : null, ctr: t.imp ? t.all / t.imp : null, cpm: t.imp ? (t.spend / t.imp) * 1000 : null };
}
/** CPC des jours rentables passés : repère de la zone grise (comme le Mac). */
function cpcRefOf(shop) {
  const today = todayKey();
  const good = new Set((shop.days || []).filter((d) => d.day < today && !d.partial && !d.costMissing && d.margin != null && d.margin > 0).map((d) => d.day));
  let sp = 0, ck = 0;
  for (const [day, , spend, , , clk] of shop.adDays || []) if (good.has(day)) { sp += spend; ck += clk || 0; }
  return ck ? sp / ck : null;

async function pollOut() {

    const lines = (await r.text()).split('\n').filter(Boolean);
    for (const l of lines) {
      let m; try { m = JSON.parse(l); } catch { continue; }
      if (m.event !== 'message') continue;
      CH.since = m.id;
      let e; try { e = await unseal(await bodyOf(m)); } catch { continue; }
      const box = CH.box.get(e.ref); if (!box) continue;
      box.seen = true;
      if ((e.kind === 'reply' || e.kind === 'unlocked') && cleanUsage(e.usage)) CH.usage = cleanUsage(e.usage);
      if (e.relock) { store(SESS, null); const bx = CH.box.get(e.ref); if (bx) bx.relock = true; }
      if (e.unpaired) forgetCred();

      else if (e.kind === 'code-set') { box.codeSet = true; box.done = true; }
      else if (e.kind === 'ack') box.status = e.queued ? 'En attente : Claude finit une autre réponse…' : 'Claude réfléchit…';
      else if (e.kind === 'code-sent') { box.status = 'Code envoyé en notification'; box.done = true; }
      else if (e.kind === 'paired') { box.paired = e.credId; box.pairedAt = e.ts; box.done = true; }

}

const ACT_TXT = (j, shop = CV.shop) => { try { const a = JSON.parse(j.replace(/("(?:id|variantId)"\s*:\s*)(\d+)/g, '$1"$2"')); const w = a.when === 'midnight' ? ' à minuit' : '';
  const bc = shop?.budgetCur || shop?.cur || 'EUR', pc = shop?.cur || 'EUR';

/** Petit Markdown sûr (tout est échappé) : gras, code, titres, listes, tableaux en lignes, blocs de code, actions. */
function md(text) {
  const inl = (x) => esc(x).replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>').replace(/`([^`\n]+)`/g, '<code>$1</code>');
  const lines = String(text || '').replace(/```action\s*([\s\S]*?)```/g, (_, j) => `\n\u0001${ACT_TXT(j)}\n`).split('\n');
  let html = '', list = null, code = null;
  const endList = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const l of lines) {
    if (code !== null) { if (/^\s*```/.test(l)) { html += `<pre>${esc(code)}</pre>`; code = null; } else code += (code ? '\n' : '') + l; continue; }
    if (/^\s*```/.test(l)) { endList(); code = ''; continue; }
    if (l.startsWith('\u0001')) { endList(); html += `<div class="act">⚡ ${esc(l.slice(1))}<small>bouton dans le chat du Mac</small></div>`; continue; }
    const li = l.match(/^\s*([-*•]|\d+[.)])\s+(.*)$/);
    if (li) { const t = /\d/.test(li[1]) ? 'ol' : 'ul'; if (list !== t) { endList(); html += `<${t}>`; list = t; } html += `<li>${inl(li[2])}</li>`; continue; }
    endList();
    const h = l.match(/^\s*#{1,4}\s+(.*)$/);
    if (h) html += `<p class="h">${inl(h[1])}</p>`;

    else if (l.trim()) html += `<p>${inl(l)}</p>`;
  }
  if (code !== null) html += `<pre>${esc(code)}</pre>`;
  endList();
  return html;
}

async function setCode() {

    await until(() => box.done, 45000);
    say(box.status === 'Code envoyé en notification' ? 'Code envoyé : regarde tes notifications, puis tape-le ici.' : box.error || 'Le Mac ne répond pas : il doit être allumé, réveillé, avec Esteban Shopify ouvert.');
  } catch (e) { say(e.message || 'Demande impossible'); }
}
function pair(code) {
  if (!/^\d{6}$/.test(code)) { say('Tape les 6 chiffres du code.'); return; }
  if (!window.PublicKeyCredential || !navigator.credentials?.create) { say('Face ID indisponible ici : ouvre la page dans Safari.'); return; }
  const env = { v: 1, kind: 'pair', id: rid(), ts: Date.now(), code };
  const challenge = sha(JSON.stringify([env.v, env.kind, env.id, env.ts, env.code]));   // synchrone : Face ID part tout de suite
  navigator.credentials.create({ publicKey: {
    rp: { id: RP, name: 'Esteban Shopify' }, user: { id: crypto.getRandomValues(new Uint8Array(16)), name: 'esteban', displayName: 'Esteban' },
    challenge, pubKeyCredParams: [{ type: 'public-key', alg: -7 }], attestation: 'none', timeout: 60000,
    authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred' } } })
    .then(async (c) => {
      env.webauthn = { attestationObject: b64ue(c.response.attestationObject), clientDataJSON: b64ue(c.response.clientDataJSON) };
      say('Envoi au Mac…');
      await sendEnv(env);
      const box = { status: 'Envoyé' }; watch(env.id, box);
      const credId = b64ue(c.rawId);
      await until(() => box.paired || box.error, 60000);
      if (box.paired === credId) { store(CRED, credId); store(CRED + ':ok', JSON.stringify({ c: credId, at: box.pairedAt || Date.now() })); toast('Chat activé'); prepUnlock(); drawChat(true); }
      else say(box.error || 'Le Mac ne répond pas : il doit être allumé, réveillé, avec Esteban Shopify ouvert.');
    })
    .catch((e) => say(e?.name === 'NotAllowedError' ? 'Face ID annulé.' : (e.message || 'Activation impossible')));
}

// ---------- code ----------
function lock(msg = '') {
  hideTabs();   // pas d'onglets sans le code
  app.innerHTML = `<div class="lock"><h1>Esteban Shopify</h1><div class="muted">Lecture seule · tes boutiques</div>
    <input id="code" type="password" autocomplete="current-password" placeholder="Code" autocapitalize="none" autocorrect="off" spellcheck="false">
    <button class="btn" id="go">Ouvrir</button><div class="err" id="err">${esc(msg)}</div></div>`;
  const open = async () => {
    const code = document.getElementById('code').value; if (!code) return;
    document.getElementById('err').textContent = '…';
    try { S.data = await decrypt(await fetchBlob(), code); store(KEY, code); render(); }
    catch { document.getElementById('err').textContent = 'Code incorrect.'; }
  };
  document.getElementById('go').onclick = open;
  document.getElementById('code').onkeydown = (e) => { if (e.key === 'Enter') open(); };
}
async function refresh() {
  const code = read(KEY); if (!code) return;
  try { S.data = await decrypt(await fetchBlob(), code); render(); } catch {}
}
(async () => {
  const code = read(KEY);
  if (!code) return lock();
  try { S.data = await decrypt(await fetchBlob(), code); render(); }
  catch { lock('Le code a changé : tape le nouveau.'); }
})();
// Mise à jour de l'appli elle-même : si une nouvelle version est publiée, on recharge (plus besoin de la remettre sur l'écran d'accueil)
async function checkUpdate() {
  try {
    const r = await fetch(`version.json?t=${Date.now()}`, { cache: 'no-store' });
    if (!r.ok) return;
    const v = await r.json();
    if (!v.build || BUILD === '__BUILD__' || v.build === BUILD) return;
    // une seule tentative par version (si le cache de GitHub sert encore l'ancienne page, pas de boucle)
    let tried = null; try { tried = sessionStorage.getItem('cockpit-reload'); } catch {}
    if (tried === v.build) return;
    try { sessionStorage.setItem('cockpit-reload', v.build); } catch {}
    location.replace(`${location.pathname}?v=${v.build}`);
  } catch {}
}
checkUpdate();
setInterval(() => { if (document.visibilityState === 'visible') { checkUpdate(); if (S.data) refresh(); } }, 120000);
setInterval(() => {
  const el = document.getElementById('upd'); if (el && S.data) el.textContent = `Mis à jour ${ago(S.data.generatedAt)}`;
  // compte à rebours des lancements programmés, sans tout redessiner
  document.querySelectorAll('[data-ltz]').forEach((x) => { const t = hmIn(x.dataset.ltz); if (t) x.textContent = t; });   // heure de chaque pays
  document.querySelectorAll('[data-launch]').forEach((x) => { const t = launchText(x.dataset.launch, x.dataset.tz, Date.now(), x.dataset.short === '1'); if (t) x.textContent = t; });
}, 30000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { checkUpdate(); if (S.data) refresh(); } });
window.addEventListener('pageshow', (e) => { if (e.persisted) { checkUpdate(); if (S.data) refresh(); } });
</script>
